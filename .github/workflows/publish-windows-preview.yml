name: Publish validated Windows preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-windows-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VALIDATED_RUN_ID: '37902074381'
      VALIDATED_COMMIT: '40afc9d0f6d603398d8fee86975ba81ff2ce9f56'
      RELEASE_TAG: v3.1.0
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve artifacts from the successful validation run
        shell: bash
        run: |
          set -euo pipefail
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATED_RUN_ID" --jq '[.conclusion,.head_sha] | @tsv')
          [[ "$state" == $'success\t'"$VALIDATED_COMMIT" ]] || { echo 'Validation run or source commit mismatch'; exit 1; }
          gh run download "$VALIDATED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "windows-x64-installer-$VALIDATED_COMMIT" --dir artifact
          gh run download "$VALIDATED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "windows-validation-$VALIDATED_COMMIT" --dir validation-evidence
      - name: Verify installer hash and acceptance evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil, zipfile, re
          candidates = [p for p in Path('artifact').glob('*.exe') if 'uninstall' not in p.name.lower()]
          assert len(candidates) == 1, 'Expected one validated installer'
          original = candidates[0]
          checksum = original.with_suffix('.exe.sha256').read_text(encoding='utf-8-sig').strip()
          expected, separator, filename = checksum.partition('  ')
          assert separator and filename == original.name
          with original.open('rb') as file:
              actual = hashlib.file_digest(file, 'sha256').hexdigest()
          assert actual == expected, 'Installer checksum mismatch'
          reports = list(Path('validation-evidence').rglob('installer.json'))
          assert len(reports) == 1, 'Acceptance evidence missing'
          report = json.loads(reports[0].read_text(encoding='utf-8-sig'))
          assert report['result'] == 'passed' and report['commit'] == os.environ['VALIDATED_COMMIT']
          target = original.with_name('iTunes-Manager-3.1.0-win-x64.exe')
          original.rename(target)
          target.with_suffix('.exe.sha256').write_text(f'{actual}  {target.name}\n', encoding='utf-8')
          logs = list(Path('validation-evidence').rglob('windows-build.log'))
          assert len(logs) == 1, 'Build evidence missing'
          text = logs[0].read_text(encoding='utf-8-sig', errors='replace')
          counts = re.search(r'(\d+) passed(?:, (\d+) skipped)?', text)
          assert counts, 'Python test results missing'
          report['python_tests'] = {'passed':int(counts[1]), 'skipped':int(counts[2] or 0)}
          Path('artifact/installer-validation.json').write_text(json.dumps(report, indent=2)+'\n', encoding='utf-8')
          sums = [f'{actual}  {target.name}']
          for name in ('iTunes-Manager-3.1.0-package-win-x64.zip', 'iTunes-Manager-3.1.0-source.zip'):
              archive_path = Path('artifact') / name
              checksum = archive_path.with_suffix('.zip.sha256').read_text(encoding='utf-8-sig').strip()
              expected, separator, filename = checksum.partition('  ')
              assert separator and filename == name, 'Archive checksum record mismatch'
              with archive_path.open('rb') as file:
                  digest = hashlib.file_digest(file, 'sha256').hexdigest()
              assert digest == expected, 'Archive checksum mismatch'
              with zipfile.ZipFile(archive_path) as archive:
                  assert archive.testzip() is None, 'Archive corruption'
                  info = json.loads(archive.read('iTunes-Manager/RELEASE-INFO.json'))
                  assert info['source_commit'] == os.environ['VALIDATED_COMMIT'] and info['version'] == '3.1.0'
                  if '-source.zip' in name:
                      package = json.loads(archive.read('iTunes-Manager/package.json'))
                      assert package['version'] == '3.1.0'
                  else:
                      for file in ('iTunes Manager.exe','resources/app.asar','resources/backend/library-backend.exe'):
                          assert 'iTunes-Manager/' + file in archive.namelist()
              sums.append(f'{digest}  {name}')
          Path('artifact/SHA256SUMS.txt').write_text('\n'.join(sums)+'\n', encoding='utf-8')
          print('Verified installer, complete app ZIP, source ZIP and source commit records.')
          PY
      - name: Publish preview installer
        shell: bash
        run: |
          trap 'detail=$(tail -c 3000 publish-error.log | tr "\n" " "); echo "::error title=Release publication diagnostics::$detail"' ERR
          exec 2> >(tee publish-error.log >&2)
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          [[ "$tag_commit" == "$VALIDATED_COMMIT" ]] || { echo 'Release tag does not match the validated build'; exit 1; }
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS.txt --pattern installer-validation.json --dir published-evidence
            cmp artifact/SHA256SUMS.txt published-evidence/SHA256SUMS.txt
            python -c 'import json,os; r=json.load(open("published-evidence/installer-validation.json")); assert r["result"]=="passed" and r["commit"]==os.environ["VALIDATED_COMMIT"]'
            echo 'Verified existing release; downloads are unchanged.'
          else
          gh release create "$RELEASE_TAG" \
            artifact/iTunes-Manager-3.1.0-win-x64.exe \
            artifact/iTunes-Manager-3.1.0-win-x64.exe.sha256 \
            artifact/installer-validation.json \
            artifact/iTunes-Manager-3.1.0-package-win-x64.zip \
            artifact/iTunes-Manager-3.1.0-package-win-x64.zip.sha256 \
            artifact/iTunes-Manager-3.1.0-source.zip \
            artifact/iTunes-Manager-3.1.0-source.zip.sha256 \
            artifact/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title '🎵 iTunes Manager 3.1.0' --notes-file docs/RELEASE_3_1_0.md
          fi
      - name: Label earlier releases
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          pages = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases', '--paginate', '--slurp'], text=True))
          tags = {item['tag_name'] for page in pages for item in page}
          for tag, label in [('v4.0.0-windows-preview', 'Earlier preview'), ('v1.0', 'Version 1.0'), ('v2.0.0', 'Version 2.0.0'), ('v3.0.0', 'Version 3.0.0')]:
              if tag not in tags:
                  print(f'{tag}: no published release to relabel')
                  continue
              subprocess.run(['gh', 'release', 'edit', tag, '--repo', repo, '--title', f'🕰️ {label} — replaced by 3.1.0'], check=True)
          PY
