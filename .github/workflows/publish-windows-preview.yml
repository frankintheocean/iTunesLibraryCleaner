name: Publish validated Windows preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-windows-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VALIDATED_RUN_ID: '37878468914'
      VALIDATED_COMMIT: 'e588f819c51ac01e932ffe0cfe6da8730f89b638'
      RELEASE_TAG: v2.0.0
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve artifacts from the successful validation run
        shell: bash
        run: |
          set -euo pipefail
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATED_RUN_ID" --jq '[.conclusion,.head_sha] | @tsv')
          [[ "$state" == $'success\t'"$VALIDATED_COMMIT" ]] || { echo 'Validation run or source commit mismatch'; exit 1; }
          gh run download "$VALIDATED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "windows-x64-installer-$VALIDATED_COMMIT" --dir artifact
          gh run download "$VALIDATED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "windows-validation-$VALIDATED_COMMIT" --dir validation-evidence
      - name: Verify installer hash and acceptance evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil
          candidates = [p for p in Path('artifact').glob('*.exe') if 'uninstall' not in p.name.lower()]
          assert len(candidates) == 1, 'Expected one validated installer'
          original = candidates[0]
          checksum = original.with_suffix('.exe.sha256').read_text(encoding='utf-8-sig').strip()
          expected, separator, filename = checksum.partition('  ')
          assert separator and filename == original.name
          with original.open('rb') as file:
              actual = hashlib.file_digest(file, 'sha256').hexdigest()
          assert actual == expected, 'Installer checksum mismatch'
          reports = list(Path('validation-evidence').rglob('installer.json'))
          assert len(reports) == 1, 'Acceptance evidence missing'
          report = json.loads(reports[0].read_text(encoding='utf-8-sig'))
          assert report['result'] == 'passed' and report['commit'] == os.environ['VALIDATED_COMMIT']
          target = original.with_name('iTunes-Manager-2.0.0-win-x64.exe')
          original.rename(target)
          target.with_suffix('.exe.sha256').write_text(f'{actual}  {target.name}\n', encoding='utf-8')
          shutil.copyfile(reports[0], 'artifact/installer-validation.json')
          print(f'Verified installer SHA-256: {actual}')
          PY
      - name: Publish preview installer
        shell: bash
        run: |
          trap 'detail=$(tail -c 3000 publish-error.log | tr "\n" " "); echo "::error title=Release publication diagnostics::$detail"' ERR
          exec 2> >(tee publish-error.log >&2)
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          [[ "$tag_commit" == "$VALIDATED_COMMIT" ]] || { echo 'Release tag does not match the validated build'; exit 1; }
          gh release create "$RELEASE_TAG" \
            artifact/iTunes-Manager-2.0.0-win-x64.exe \
            artifact/iTunes-Manager-2.0.0-win-x64.exe.sha256 \
            artifact/installer-validation.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title '🎵 iTunes Manager 2.0.0' --notes-file docs/RELEASE_2_0_0.md
      - name: Label the earlier preview as superseded
        shell: bash
        run: |
          gh release edit v4.0.0-windows-preview --repo "$GITHUB_REPOSITORY" \
            --title '🕰️ Earlier preview — replaced by 2.0.0'
          gh release edit v1.0 --repo "$GITHUB_REPOSITORY" \
            --title '🕰️ Version 1.0 — replaced by 2.0.0'
