name: Windows installer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-build.yml'
      - '.gitattributes'
      - 'backend/**'
      - 'desktop/**'
      - 'frontend/**'
      - 'legacy/**'
      - 'resources/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - 'requirements*.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build and test Windows bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/validation | Out-Null
          try {
            & ./scripts/build-windows.ps1 *>&1 | Tee-Object build/validation/windows-build.log
          } catch {
            "## Windows build failure" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            '```text' | Out-File $env:GITHUB_STEP_SUMMARY -Append
            Get-Content build/validation/windows-build.log -Tail 120 | Out-File $env:GITHUB_STEP_SUMMARY -Append
            $_ | Out-String | Out-File $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
            $detail = ((Get-Content build/validation/windows-build.log -Tail 20) + ($_ | Out-String)) -join "`n"
            if ($detail.Length -gt 3500) { $detail = $detail.Substring($detail.Length - 3500) }
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows build diagnostics::$detail"
            throw
          }
      - name: Validate install, packaged app, repair and uninstall
        shell: pwsh
        run: |
          try {
            & ./scripts/test-windows-installer.ps1 *>&1 | Tee-Object build/validation/windows-installer.log
          } catch {
            "## Installer validation failure" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            '```text' | Out-File $env:GITHUB_STEP_SUMMARY -Append
            Get-Content build/validation/windows-installer.log -Tail 120 | Out-File $env:GITHUB_STEP_SUMMARY -Append
            $_ | Out-String | Out-File $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
            $detail = ((Get-Content build/validation/windows-installer.log -Tail 20) + ($_ | Out-String)) -join "`n"
            if ($detail.Length -gt 3500) { $detail = $detail.Substring($detail.Length - 3500) }
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Installer validation diagnostics::$detail"
            throw
          }
      - name: Create Windows package and source ZIPs
        shell: pwsh
        run: |
          try {
            & ./.venv/Scripts/python.exe scripts/package-windows.py *>&1 | Tee-Object build/validation/windows-package.log
            if ($LASTEXITCODE -ne 0) { throw 'Windows package failed' }
            & ./.venv/Scripts/python.exe scripts/package-source.py --output-dir dist/windows *>&1 | Tee-Object -Append build/validation/windows-package.log
            if ($LASTEXITCODE -ne 0) { throw 'Source package failed' }
            & ./.venv/Scripts/python.exe scripts/benchmark-library.py --report build/validation/library-speed.json *>&1 | Tee-Object -Append build/validation/windows-package.log
            if ($LASTEXITCODE -ne 0) { throw 'Large-library check failed' }
          } catch {
            $detail = ((Get-Content build/validation/windows-package.log -Tail 25) + ($_ | Out-String)) -join "`n"
            if ($detail.Length -gt 3500) { $detail = $detail.Substring($detail.Length - 3500) }
            $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows package diagnostics::$detail"
            throw
          }
      - name: Hash installer
        shell: pwsh
        run: |
          Get-ChildItem dist/windows -Filter '*.exe' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Encoding utf8 "$($_.FullName).sha256"
          }
      - name: Publish 1.0.0 GitHub release assets
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne '1.0.0') {
            Write-Host "Release publishing is limited to version 1.0.0; package version is $version."
            exit 0
          }
          $tag = "v$version"
          $assets = @(
            "dist/windows/iTunes-Manager-$version-win-x64.exe",
            "dist/windows/iTunes-Manager-$version-win-x64.exe.sha256",
            "dist/windows/iTunes-Manager-$version-package-win-x64.zip",
            "dist/windows/iTunes-Manager-$version-package-win-x64.zip.sha256",
            "dist/windows/iTunes-Manager-$version-source.zip",
            "dist/windows/iTunes-Manager-$version-source.zip.sha256"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset -PathType Leaf)) { throw "Required release asset is missing: $asset" }
          }
          $expectedNames = @($assets | ForEach-Object { Split-Path $_ -Leaf })
          $view = gh release view $tag --json tagName,isDraft,assets 2>$null
          $viewStatus = $LASTEXITCODE
          if ($viewStatus -eq 0) {
            $release = ($view -join [Environment]::NewLine) | ConvertFrom-Json
            $existingNames = @($release.assets | ForEach-Object { $_.name })
            $missingNames = @($expectedNames | Where-Object { $_ -notin $existingNames })
            if (-not $release.isDraft) {
              if ($missingNames.Count -gt 0) {
                throw "Published release $tag is missing expected assets ($($missingNames -join ', ')); refusing to change a published release automatically."
              }
              Write-Host "Release $tag is already published with all six expected assets; leaving it unchanged."
              exit 0
            }
            foreach ($name in $existingNames) {
              if ($name -notin $expectedNames) {
                gh release delete-asset $tag $name --yes
                if ($LASTEXITCODE -ne 0) { throw "Could not remove stale release asset $name from draft $tag" }
              }
            }
            # A draft release may already have been created by release-note automation.
            # Populate it before publishing, instead of mistaking it for a finished release.
            gh release upload $tag $assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Uploading the six release assets failed for draft $tag" }
            gh release edit $tag --tag $tag --target $env:GITHUB_SHA --title "🎵 iTunes Manager $version" --notes-file docs/RELEASE_1_0_0.md --draft=false --prerelease=false
            if ($LASTEXITCODE -ne 0) { throw "Publishing the populated draft release failed for $tag" }
            Write-Host "Populated and published the existing v1.0.0 draft with all expected assets."
          } else {
            gh release create $tag $assets --title "🎵 iTunes Manager $version" --notes-file docs/RELEASE_1_0_0.md --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed for $tag" }
          }
      - name: Upload Windows installer and checksums
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer-${{ github.sha }}
          path: |
            dist/windows/*.exe
            dist/windows/*.exe.sha256
            dist/windows/*.zip
            dist/windows/*.zip.sha256
            dist/windows/*.blockmap
            dist/windows/latest.yml
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation-${{ github.sha }}
          path: |
            build/validation/**
            build/pyinstaller/**/warn-*.txt
          if-no-files-found: ignore
          retention-days: 30
