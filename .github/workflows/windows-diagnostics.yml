name: Build and release diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-diagnostics.yml']
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Workflow run to inspect'
        required: true
        default: '37902844832'
permissions:
  contents: read
  actions: read
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Read failed workflow steps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id || '37902844832' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > failed.log
          python - <<'PY'
          from pathlib import Path
          text = '\n'.join(Path('failed.log').read_text().splitlines()[-45:])[-7000:]
          text = text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::warning title=Workflow failure details::'+text)
          PY
